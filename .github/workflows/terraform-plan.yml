name: Terraform dev plan

on:
  pull_request:
    branches: [dev]
    paths:
      - ".github/workflows/terraform-*.yml"
      - "terraform/**"
  workflow_dispatch:
    inputs:
      billing_test_only:
        description: "Plan only the dedicated TEST billing Secret and server execution read policy"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev-plan
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      legacy_dev: ${{ steps.scope.outputs.legacy_dev }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Classify Terraform root without AWS credentials
        id: scope
        env:
          SOURCE_EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci-terraform-scope.py

  plan:
    needs: scope
    if: >-
      needs.scope.outputs.legacy_dev == 'true' &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.AWS_PLAN_ROLE_ARN != '' &&
      vars.TF_STATE_BUCKET != '' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    environment: dev-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ipgo-infra-plan
      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text >/dev/null
      - name: Configure public endpoint
        env:
          ACM_CERTIFICATE_ARN: ${{ vars.AWS_ACM_CERTIFICATE_ARN }}
          HTTP_DEV_ENDPOINT: ${{ vars.AWS_ENABLE_HTTP_DEV_ENDPOINT }}
          API_DOMAIN_NAME: ${{ vars.AWS_API_DOMAIN_NAME }}
          LEGACY_ALB_ENABLED: ${{ vars.AWS_ENABLE_LEGACY_ALB }}
        shell: bash
        run: |
          case "$LEGACY_ALB_ENABLED" in
            ''|true) echo 'TF_VAR_enable_legacy_alb=true' >> "$GITHUB_ENV" ;;
            false) echo 'TF_VAR_enable_legacy_alb=false' >> "$GITHUB_ENV" ;;
            *) echo '::error::AWS_ENABLE_LEGACY_ALB must be true, false, or unset.'; exit 1 ;;
          esac
          if [ -n "$API_DOMAIN_NAME" ]; then
            if [[ ! "$API_DOMAIN_NAME" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}$ ]]; then
              echo "::error::AWS_API_DOMAIN_NAME must be a DNS hostname without a scheme, port or path."
              exit 1
            fi
            printf 'TF_VAR_https_redirect_host=%s\n' "$API_DOMAIN_NAME" >> "$GITHUB_ENV"
          fi
          case "$HTTP_DEV_ENDPOINT" in
            true)
              echo 'TF_VAR_enable_http_dev_endpoint=true' >> "$GITHUB_ENV"
              exit 0
              ;;
            ''|false) ;;
            *)
              echo "::error::AWS_ENABLE_HTTP_DEV_ENDPOINT must be true, false, or unset."
              exit 1
              ;;
          esac
          if [ -n "$ACM_CERTIFICATE_ARN" ]; then
            if [ -z "$API_DOMAIN_NAME" ]; then
              echo "::error::Set AWS_API_DOMAIN_NAME before enabling HTTPS redirects."
              exit 1
            fi
            if [[ ! "$ACM_CERTIFICATE_ARN" =~ ^arn:aws:acm:ap-northeast-2:[0-9]{12}:certificate/[0-9a-f-]{36}$ ]]; then
              echo "::error::AWS_ACM_CERTIFICATE_ARN must identify a Seoul ACM certificate."
              exit 1
            fi
            printf 'TF_VAR_certificate_arn=%s\n' "$ACM_CERTIFICATE_ARN" >> "$GITHUB_ENV"
          fi
      - name: Configure monitoring
        env:
          DEV_MONITORING_ENABLED: ${{ vars.AWS_ENABLE_DEV_MONITORING }}
          ALERT_EMAIL: ${{ secrets.AWS_ALERT_EMAIL }}
          MONTHLY_BUDGET_USD: ${{ vars.AWS_MONTHLY_BUDGET_USD }}
          CONTAINER_INSIGHTS: ${{ vars.AWS_CONTAINER_INSIGHTS }}
        run: python3 scripts/configure-monitoring.py
      - name: Configure backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          {
            echo "bucket = \"$TF_STATE_BUCKET\""
            echo 'key = "environments/dev/terraform.tfstate"'
            echo 'region = "ap-northeast-2"'
            echo 'encrypt = true'
            echo 'use_lockfile = true'
          } > terraform/environments/dev/backend.hcl
      - name: Initialize
        run: terraform -chdir=terraform/environments/dev init -backend-config=backend.hcl -input=false
      - name: Validate
        run: terraform -chdir=terraform/environments/dev validate
      - name: Plan without publishing sensitive details
        id: plan
        env:
          BILLING_TEST_ONLY: ${{ inputs.billing_test_only }}
        shell: bash
        run: |
          targets=()
          if [ "$BILLING_TEST_ONLY" = true ]; then
            targets=(-target=aws_secretsmanager_secret.server_billing_test '-target=module.identity.aws_iam_role_policy.server_secrets[0]')
          fi
          set +e
          terraform -chdir=terraform/environments/dev plan \
            -input=false \
            -lock=false \
            -no-color \
            -detailed-exitcode \
            "${targets[@]}" \
            -out=dev.tfplan \
            > "$RUNNER_TEMP/terraform-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -eq 1 ]; then
            echo "::error::Terraform plan failed. The detailed plan is intentionally not published from this public repository."
            sed -n 's/^Error: /Terraform error: /p' "$RUNNER_TEMP/terraform-plan.log" \
              | head -n 5 \
              | sed -E 's/arn:[^[:space:]]+/[redacted-arn]/g; s/[0-9]{12}/[redacted-account]/g; s/\([^)]*\)/([redacted])/g' \
              | while IFS= read -r summary; do
                  echo "::error::$summary"
                done
            exit 1
          fi
          if [ "$status" -eq 2 ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Summarize plan
        env:
          BILLING_TEST_ONLY: ${{ inputs.billing_test_only }}
          CHANGED: ${{ steps.plan.outputs.changed }}
        run: |
          terraform -chdir=terraform/environments/dev show -json dev.tfplan \
            | jq -r '
              [.resource_changes[]? | .change.actions | join(",")] as $actions |
              "create=" + (($actions | map(select(. == "create")) | length) | tostring) +
              ", update=" + (($actions | map(select(. == "update")) | length) | tostring) +
              ", replace=" + (($actions | map(select(. == "delete,create" or . == "create,delete")) | length) | tostring) +
              ", delete=" + (($actions | map(select(. == "delete")) | length) | tostring)'
          echo "Terraform change detected: $CHANGED" >> "$GITHUB_STEP_SUMMARY"
          terraform -chdir=terraform/environments/dev show -json dev.tfplan \
            | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) |
                (.change.before // {}) as $before | (.change.after // {}) as $after |
                [((($before | keys) + ($after | keys)) | unique)[] |
                  select($before[.] != $after[.])] as $keys |
                [.address, (.change.actions | join(",")), ($keys | join(","))] | @tsv' \
            | tee -a "$GITHUB_STEP_SUMMARY"

          if [ "$BILLING_TEST_ONLY" = true ]; then
            terraform -chdir=terraform/environments/dev show -json dev.tfplan | python3 scripts/check-billing-test-plan.py
          fi
