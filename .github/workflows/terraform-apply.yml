name: Terraform dev apply

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type PLAN_DEV for plan-only, or APPLY_DEV after reviewing a current plan"
        required: true
        type: string
      plan_only:
        description: "Review a plan using the protected dev deployment role without applying it"
        type: boolean
        default: false
      https_listener_only:
        description: "Reject changes other than HTTPS creation and an in-place HTTP redirect"
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-dev-apply
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      github.ref == 'refs/heads/dev' &&
      ((inputs.plan_only && inputs.confirmation == 'PLAN_DEV') ||
       (!inputs.plan_only && inputs.confirmation == 'APPLY_DEV')) &&
      vars.AWS_ACCOUNT_ID != '' &&
      vars.AWS_APPLY_ROLE_ARN != '' &&
      vars.TF_STATE_BUCKET != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd
        with:
          aws-region: ap-northeast-2
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: ipgo-infra-apply
      - name: Verify AWS identity
        run: aws sts get-caller-identity --query Arn --output text >/dev/null
      - name: Configure public endpoint
        env:
          ACM_CERTIFICATE_ARN: ${{ vars.AWS_ACM_CERTIFICATE_ARN }}
          HTTP_DEV_ENDPOINT: ${{ vars.AWS_ENABLE_HTTP_DEV_ENDPOINT }}
          API_DOMAIN_NAME: ${{ vars.AWS_API_DOMAIN_NAME }}
        shell: bash
        run: |
          if [ -n "$API_DOMAIN_NAME" ]; then
            if [[ ! "$API_DOMAIN_NAME" =~ ^([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z]{2,63}$ ]]; then
              echo "::error::AWS_API_DOMAIN_NAME must be a DNS hostname without a scheme, port or path."
              exit 1
            fi
            printf 'TF_VAR_https_redirect_host=%s\n' "$API_DOMAIN_NAME" >> "$GITHUB_ENV"
          fi
          case "$HTTP_DEV_ENDPOINT" in
            true)
              echo 'TF_VAR_enable_http_dev_endpoint=true' >> "$GITHUB_ENV"
              exit 0
              ;;
            ''|false) ;;
            *)
              echo "::error::AWS_ENABLE_HTTP_DEV_ENDPOINT must be true, false, or unset."
              exit 1
              ;;
          esac
          if [ -n "$ACM_CERTIFICATE_ARN" ]; then
            if [ -z "$API_DOMAIN_NAME" ]; then
              echo "::error::Set AWS_API_DOMAIN_NAME before enabling HTTPS redirects."
              exit 1
            fi
            if [[ ! "$ACM_CERTIFICATE_ARN" =~ ^arn:aws:acm:ap-northeast-2:[0-9]{12}:certificate/[0-9a-f-]{36}$ ]]; then
              echo "::error::AWS_ACM_CERTIFICATE_ARN must identify a Seoul ACM certificate."
              exit 1
            fi
            printf 'TF_VAR_certificate_arn=%s\n' "$ACM_CERTIFICATE_ARN" >> "$GITHUB_ENV"
          fi
      - name: Configure backend
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          {
            echo "bucket = \"$TF_STATE_BUCKET\""
            echo 'key = "environments/dev/terraform.tfstate"'
            echo 'region = "ap-northeast-2"'
            echo 'encrypt = true'
            echo 'use_lockfile = true'
          } > terraform/environments/dev/backend.hcl
      - name: Initialize and validate
        run: |
          terraform -chdir=terraform/environments/dev init -backend-config=backend.hcl -input=false
          terraform -chdir=terraform/environments/dev validate
      - name: Create approved plan
        shell: bash
        run: |
          set +e
          terraform -chdir=terraform/environments/dev plan \
            -input=false \
            -out=dev.tfplan \
            > "$RUNNER_TEMP/terraform-plan.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Terraform plan failed. Detailed output is not published from this public repository."
            exit 1
          fi
      - name: Review changes without publishing values
        env:
          HTTPS_LISTENER_ONLY: ${{ inputs.https_listener_only }}
        shell: bash
        run: |
          terraform -chdir=terraform/environments/dev show -json dev.tfplan \
            | jq -r '.resource_changes[]? | select(.change.actions != ["no-op"]) |
                (.change.before // {}) as $before | (.change.after // {}) as $after |
                [((($before | keys) + ($after | keys)) | unique)[] |
                  select($before[.] != $after[.])] as $keys |
                [.address, (.change.actions | join(",")), ($keys | join(","))] | @tsv' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$HTTPS_LISTENER_ONLY" = true ]; then
            terraform -chdir=terraform/environments/dev show -json dev.tfplan \
              | jq -e 'all(.resource_changes[]?;
                  .change.actions == ["no-op"] or
                  (.mode == "data" and .change.actions == ["read"]) or
                  (.address == "module.compute.aws_lb_listener.https[0]" and .change.actions == ["create"]) or
                  (.address == "module.compute.aws_lb_listener.http[0]" and .change.actions == ["update"]))' \
              > /dev/null || {
                echo "::error::Plan contains changes outside the approved HTTPS listener transition."
                exit 1
              }
          fi
      - name: Apply approved plan
        if: ${{ !inputs.plan_only }}
        shell: bash
        run: |
          set +e
          terraform -chdir=terraform/environments/dev apply \
            -input=false \
            -auto-approve \
            dev.tfplan \
            > "$RUNNER_TEMP/terraform-apply.log" 2>&1
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::error::Terraform apply failed. Inspect AWS and the protected runner log before retrying."
            exit 1
          fi
          echo "Approved dev apply completed." >> "$GITHUB_STEP_SUMMARY"
