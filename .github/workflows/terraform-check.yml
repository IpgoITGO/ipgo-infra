name: Terraform check

on:
  pull_request:
  push:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify D0 isolated plan and workflow gates
        run: |
          python3 -m venv "$RUNNER_TEMP/d0-plan-venv"
          "$RUNNER_TEMP/d0-plan-venv/bin/pip" install -r scripts/d0-plan-requirements.txt
          "$RUNNER_TEMP/d0-plan-venv/bin/python" -m unittest discover -s tests/d0 -p 'test_*.py'
      - name: Verify monitoring change boundaries
        run: python3 scripts/test-monitoring-plan.py
      - name: Verify RDS controller failure boundaries
        run: python3 -m unittest discover -s tests/rds_offhours -p 'test_*.py'
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
      - run: terraform fmt -check -recursive

  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - terraform/bootstrap
          - terraform/environments/dev
          - terraform/environments/rds-offhours
          - terraform/modules/rds-offhours
          - terraform/environments/d0-validation
          - terraform/modules/d0-validation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e
        with:
          terraform_version: 1.17.1
      - run: terraform -chdir=${{ matrix.root }} init -backend=false -input=false
      - run: terraform -chdir=${{ matrix.root }} validate
      - if: contains(matrix.root, 'rds-offhours') || contains(matrix.root, 'd0-validation')
        run: terraform -chdir=${{ matrix.root }} test
      - if: matrix.root == 'terraform/modules/rds-offhours'
        run: python3 tests/rds_offhours/verify_lambda_archive.py terraform/modules/rds-offhours/.terraform/rds-offhours.zip

  rds-local-postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m venv .venv-rds
      - run: .venv-rds/bin/pip install -r runtime/rds_offhours/requirements.txt
      - run: .venv-rds/bin/python tests/rds_offhours/verify_aws_contract.py
      - run: docker pull postgres:16-alpine
      - run: .venv-rds/bin/python tests/rds_offhours/verify_postgres_tls.py

  deployment-evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Test offline deployment evidence and timing guards
        run: python3 -m unittest discover -s scripts/deployment -p "test_*.py" -v

  billing-plan-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/test-billing-test-plan.py
