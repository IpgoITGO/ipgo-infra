include classpath("application.conf")

# 반환되는 queue URL이 compose 내부 이름(elasticmq)을 가리키게 한다.
node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  # 계산 결과 메시지가 SQS 기본 256KiB를 넘을 수 있어 AWS 구성(1MiB)처럼 크기 제한을 풀어 둔다.
  sqs-limits = relaxed
}

rest-stats.enabled = false

# terraform/modules/messaging과 같은 값: jobs 900초·results 120초, 5회 실패 시 DLQ.
queues {
  ipgo-dev-jobs {
    defaultVisibilityTimeout = 900 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "ipgo-dev-jobs-dlq"
      maxReceiveCount = 5
    }
  }
  ipgo-dev-results {
    defaultVisibilityTimeout = 120 seconds
    receiveMessageWait = 0 seconds
    deadLettersQueue {
      name = "ipgo-dev-results-dlq"
      maxReceiveCount = 5
    }
  }
  ipgo-dev-jobs-dlq {}
  ipgo-dev-results-dlq {}
}
