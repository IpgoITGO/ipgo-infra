# ipgo-dev-api.iwhya.kr — NAS 개발 API (nas/compose.yaml의 server, 127.0.0.1:18090)
# 설치·인증서 발급·되돌리기는 nas/README.md의 "외부 공개"를 따른다.
# Client(Vercel)가 /api/*를 이 주소로 프록시한다. 그 밖의 경로는 공개하지 않는다.

server {
    # NAS nginx 1.24는 `http2 on;` 지시어가 없어 listen에 적는다.
    listen 192.168.0.19:443 ssl http2;
    listen 127.0.0.1:443 ssl http2;
    server_name ipgo-dev-api.iwhya.kr;

    ssl_certificate /etc/letsencrypt/live/ipgo-dev-api.iwhya.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ipgo-dev-api.iwhya.kr/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/ipgo-dev-api-access.log;
    error_log /var/log/nginx/ipgo-dev-api-error.log;

    # Server multipart 한도(10MB 파일, 11MB 요청)에 맞춘다. nginx 기본값 1MB로는 업로드가 413이 된다.
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://127.0.0.1:18090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:18090;
        proxy_set_header Host $host;
        access_log off;
    }

    location / {
        return 404;
    }
}

server {
    listen 192.168.0.19:80;
    listen 127.0.0.1:80;
    server_name ipgo-dev-api.iwhya.kr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
